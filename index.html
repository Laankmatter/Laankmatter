<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Laankmatter | Trading</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            text-align: center;
        }
        header {
            padding: 60px 20px;
        }
        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
            opacity: 0.8;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #00ff99;
            color: black;
            text-decoration: none;
            font-weight: bold;
            border-radius: 30px;
            transition: 0.3s;
        }
        .btn:hover {
            background: white;
        }
        footer {
            margin-top: 80px;
            padding: 20px;
            font-size: 14px;
            opacity: 0.6;
        }
    </style>
</head>
<body>


    <header>
    <h1>Laankmatter 🚀</h1>
    <p>Trading | Educación Financiera | Mentalidad</p>

    <!-- Aquí pegamos el contador -->
    <div style="font-size: 30px; margin-top: 20px;" id="contador">
    Ganancias: $0.00
</div>

<script>
let ganancias = 0;

// Cada 50ms actualizamos el contador
setInterval(() => {
    // Suma un número aleatorio entre 1 y 5
    let incremento = Math.random() * 4 + 1; 
    ganancias += incremento;

    // Mostramos con 2 decimales
    document.getElementById("contador").innerText = "Ganancias: $" + ganancias.toFixed(2);
</script>

<footer>
    © 2026 Laankmatter - Todos los derechos reservados
</footer>

</body>
</html>
